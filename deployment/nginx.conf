# Unsubscribe links: a bounded rate, so random tokens cannot be tried
# without limit. Per client: behind Cloudflare the client is
# CF-Connecting-IP, so people who share an edge do not share a bucket;
# without it, the peer. Per peer, a looser limit, so a caller that reaches
# the server directly and invents that header is still held.
map $http_cf_connecting_ip $mail_unsubscribe_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $mail_unsubscribe_client zone=mail_unsubscribe:2m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mail_unsubscribe_peer:1m rate=50r/s;

upstream frontend {
    server frontend:3011;
}

upstream backend {
    server backend:3001;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name wunderland.sh www.wunderland.sh;

    # An unsubscribe link opened over http: not logged (its path holds the
    # token), and 308 so a one-click POST stays a POST.
    location ~* ^/api/email/unsubscribe/ {
        access_log off;
        return 308 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wunderland.sh www.wunderland.sh;

    ssl_certificate /etc/ssl/origin.crt;
    ssl_certificate_key /etc/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # WebSocket — Socket.IO → backend directly
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mail unsubscribe links carry a bearer token in the path: not logged,
    # and refusals logged at info, below the error log's level.
    location ~* ^/api/email/unsubscribe/ {
        access_log off;
        limit_req zone=mail_unsubscribe burst=20 nodelay;
        limit_req zone=mail_unsubscribe_peer burst=200 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All routes (including /api/) → Next.js frontend.
    # Next.js API routes handle on-chain reads directly and proxy
    # backend-specific calls to the NestJS backend internally.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
